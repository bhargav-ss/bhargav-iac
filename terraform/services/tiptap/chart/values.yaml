# Default values for tiptap-collab-server chart.
# This is a YAML-formatted file.
# Declare variables that are passed into your templates.

replicaCount: 1

image:
  repository: 249531194221.dkr.ecr.us-west-2.amazonaws.com/bhargav/tiptap
  pullPolicy: IfNotPresent
  # Tag should come from chart appVersion
  tag: "1.0.0"

serviceAccount:
  # name: tiptap-collab-server-sa # We'll let Terraform manage the SA name and pass it in if needed, or use a generated name.
  # For EKS Pod Identity, the SA name is important for the association.
  # If Terraform creates the SA and the Helm chart also tries to create it, there can be conflicts.
  # Best to have Terraform create the SA, and the chart *uses* it.
  # However, if the chart *defines* the SA, Terraform should not also define it.
  # For now, let's assume the chart will define its own SA if not provided an existing one.
  # We will likely have Terraform create the SA and pass its name to the Helm chart.
  create: true # Let the chart create it, but we'll ensure Terraform creates the Pod Identity association to this SA name.
  name: "tiptap-collab-server-sa" # Default name, matches what we had before
  annotations: {}
  # eks.amazonaws.com/security-group-for-pods: "" # Placeholder for SG ID
  # automountServiceAccountToken: true # Default is usually true

# Non-sensitive environment variables
config:
  PORT_API: "8081"
  AWS_USE_S3: "1"
  AWS_BUCKET_NAME: "bhargav-tiptap-poc"
  AWS_FOLDER_NAME: "tiptap-prod"
  AWS_REGION: "us-west-2" 
  AWS_FORCE_PATH_STYLE: "1"
  DATABASE_URL: "postgres://scispace_root:5b2uhtv5aK8z@scispace.c0fwkhspicdq.us-west-2.rds.amazonaws.com:5432/tiptap"
  DATABASE_URL_DIRECT: "postgres://scispace_root:5b2uhtv5aK8z@scispace.c0fwkhspicdq.us-west-2.rds.amazonaws.com:5432/tiptap"
  COLLAB_CLUSTERMODE: "1"
  REDIS_URL: "redis://placeholder"

# Sensitive environment variables (will be put into a Kubernetes Secret)
secrets:
  LICENSE_KEY: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwczovL2Nsb3VkLnRpcHRhcC5kZXYiLCJpYXQiOjE3NDczMzc3MzMuOTgxOTIxLCJhdWQiOiJ4OWxkMGxsayJ9.QwRvQ21KPv8vEpFV991AUbAylVG0VWCY5wGbQOVZnms"
  JWT_SECRET: ""
  API_SECRET: "huhuhaha"

service:
  type: ClusterIP # Or LoadBalancer
  ports:
    collab: 8080
    api: 8081
    metrics: 8082

# Probes for deployment
readinessProbe:
  httpGet:
    path: /
    port: collab # Changed from api to collab (port 8080)
  initialDelaySeconds: 15
  periodSeconds: 20

livenessProbe:
  httpGet:
    path: /
    port: collab # Changed from api to collab (port 8080)
  initialDelaySeconds: 30
  periodSeconds: 30
