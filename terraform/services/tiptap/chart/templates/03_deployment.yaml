apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tiptap-collab-server.name" . }}-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiptap-collab-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tiptap-collab-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tiptap-collab-server.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "tiptap-collab-server.configChecksum" . }}
    spec:
      serviceAccountName: {{ include "tiptap-collab-server.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: collab
              containerPort: {{ .Values.service.ports.collab }}
              protocol: TCP
            - name: api
              containerPort: {{ .Values.service.ports.api }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "tiptap-collab-server.name" . }}-config
            - secretRef:
                name: {{ include "tiptap-collab-server.name" . }}-secrets
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }} 