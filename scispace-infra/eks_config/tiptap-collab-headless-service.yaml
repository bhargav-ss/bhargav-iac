apiVersion: v1
kind: Service
metadata:
  name: tiptap-collab-headless
  namespace: ${tiptap_collab_namespace} # Templated
  labels:
    app: tiptap-collab
    # Add any other labels you use for service discovery if needed
spec:
  clusterIP: None # This makes the service headless
  selector:
    app: tiptap-collab # This must match the labels on your Tiptap Collab pods
  ports:
    - name: http-collab
      port: 8080
      targetPort: 8080 # Assuming your Tiptap collab endpoint listens on 8080
      protocol: TCP
    - name: http-api
      port: 8081
      targetPort: 8081 # Assuming your Tiptap API endpoint listens on 8081
      protocol: TCP 