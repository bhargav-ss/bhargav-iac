# kube-services-nodepool.yaml
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: kube-services
spec:
  template:
    metadata:
      labels:
        NodeGroupType: kube-services # Label to distinguish these nodes
        intent: system-services
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: kube-services # References the NodeClass created above
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"] # Typically on-demand for system services
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # Define instance size constraints - e.g., general purpose, smaller instances
        - key: karpenter.ksh.k8s.aws/instance-category
          operator: In
          values: ["m", "t"]
        - key: karpenter.ksh.k8s.aws/instance-generation
          operator: Gt
          values: ["2"] # e.g., t3, m5 or newer
  limits:
    cpu: "20" # Adjust limits as needed
    memory: 40Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    expireAfter: Never # Nodes don't expire unless empty and consolidated 